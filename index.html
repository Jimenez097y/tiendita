<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6D9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pedidos Tiendita Dulce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@400;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --backdrop:#EFE6BE; --bg:#FBF6D9; --surface:#FFFDF2; --surface2:#F3ECC4; --ink:#1E1A1D; --muted:#6E6470; --line:#E6DCB0;
  --pink:#C9549D; --pink-ink:#fff; --pink-soft:#F6D6EA;
  --amber:#B7791F; --amber-bg:#FCEBC4; --blue:#2F6FB5; --blue-bg:#DCE9F8; --green:#2E8B57; --green-bg:#D6F0DF;
  --grey:#7A7378; --grey-bg:#ECE7E2; --red:#C0392B; --red-bg:#F8DAD5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --backdrop:#121012; --bg:#1B171A; --surface:#252024; --surface2:#2F292E; --ink:#F6EFE0; --muted:#B3A9B1; --line:#3B3339;
  --pink:#EE8FCB; --pink-ink:#1B171A; --pink-soft:#4B2A40;
  --amber:#F2C265; --amber-bg:#4A3713; --blue:#8DB9EE; --blue-bg:#1F3350; --green:#7FD3A2; --green-bg:#1C3D2A;
  --grey:#B0A8AD; --grey-bg:#3A3438; --red:#F19A8F; --red-bg:#4C2420;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --backdrop:#121012; --bg:#1B171A; --surface:#252024; --surface2:#2F292E; --ink:#F6EFE0; --muted:#B3A9B1; --line:#3B3339;
  --pink:#EE8FCB; --pink-ink:#1B171A; --pink-soft:#4B2A40;
  --amber:#F2C265; --amber-bg:#4A3713; --blue:#8DB9EE; --blue-bg:#1F3350; --green:#7FD3A2; --green-bg:#1C3D2A;
  --grey:#B0A8AD; --grey-bg:#3A3438; --red:#F19A8F; --red-bg:#4C2420;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--backdrop)}
body{height:100%;margin:0;background:var(--backdrop);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;display:flex;justify-content:center;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- marco 9:16 ---------- */
.phone{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px) and (min-height:560px){
  body{align-items:center;padding-block:16px}
  .phone{width:auto;max-width:none;height:min(100%,920px);aspect-ratio:9/16;border:2px solid var(--ink);border-radius:30px;box-shadow:0 18px 50px rgba(30,20,28,.18)}
}
header.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:"Chewy","Comic Sans MS",cursive;font-size:24px;line-height:1;letter-spacing:.3px}
.brand small{display:block;font-family:"Nunito",sans-serif;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.sync{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.local i{background:var(--amber)}
.sync.wait i{background:var(--grey)}
.screen{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px;-webkit-overflow-scrolling:touch}

/* ---------- navegación inferior ---------- */
nav.bottom{flex:0 0 auto;display:grid;grid-template-columns:repeat(var(--tabs,3),1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.bottom button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
nav.bottom svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-selected="true"]{color:var(--pink)}
nav.bottom .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--pink);color:var(--pink-ink);font-size:11px;display:grid;place-items:center}
nav.bottom .badge[hidden]{display:none}

/* ---------- carta ---------- */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:10px;margin-inline:-16px;padding-inline:16px;padding-bottom:6px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{width:100%;margin-top:6px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.cathead{font-family:"Chewy",cursive;font-size:19px;margin:14px 0 6px;letter-spacing:.3px}
.accs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.acc.open{border-color:var(--ink)}
.acch{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:13px 14px;text-align:left}
.acct-t{font-family:"Chewy","Comic Sans MS",cursive;font-size:19px;letter-spacing:.3px}
.accm{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800;font-size:12px}
.accq{background:var(--pink);color:var(--pink-ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;font-size:12px}
.accm svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.acc.open .accm svg{transform:rotate(180deg)}
.acc .grid{padding:6px 10px 12px}
.accnote{font-size:12px;color:var(--muted);padding:0 14px 8px;margin-top:-4px}
.acc.est .acch{padding:11px 14px}
.acc.est .acct-t{font-family:"Nunito",system-ui,sans-serif;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.edot{width:10px;height:10px;border-radius:50%;background:var(--st);display:inline-block}
.estn{background:var(--stbg);color:var(--st);border-radius:999px;min-width:26px;height:22px;display:grid;place-items:center;padding:0 8px;font-size:12px}
.acc.est.open{border-color:var(--st)}
.acctools{display:flex;justify-content:flex-end;margin-top:6px}
.acctools button{border:0;background:transparent;font-weight:800;font-size:12px;color:var(--muted);padding:4px 2px}
.mesas{flex-wrap:wrap}
.cathead span{font-family:"Nunito",sans-serif;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;flex-direction:column;justify-content:space-between;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px;min-height:78px;position:relative;transition:transform .08s}
.item:active{transform:scale(.96)}
.item.on{border-color:var(--pink);background:var(--pink-soft)}
.item.off{opacity:.45;background:var(--surface2);border-style:dashed}
.item.off .p{color:var(--muted);text-decoration:line-through}
.item .ag{position:absolute;bottom:10px;right:10px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--red-bg);color:var(--red);border-radius:999px;padding:2px 7px}
.item.edit{border-style:dashed}
.xtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:1px 6px;vertical-align:middle}
.xbox{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:-4px 0 14px}
.xhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14px}
.xhead span{font-size:12px;color:var(--muted);font-weight:700}
.xbox .row .btn{padding:9px 8px;font-size:13px}
.xsum{font-size:13px;font-weight:800;margin-top:8px;text-align:right}
.dlvbox{background:var(--blue-bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.dlvbox .addr{font-weight:800;font-size:14px}
.dlvbtns{display:flex;gap:6px;flex-wrap:wrap}
.dlvbtns a{flex:1 1 auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:800;font-size:13px;color:var(--blue);text-decoration:none}
.cajabtn{width:100%;margin-top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:13px}
.cajabtn b{font-size:15px;margin-left:3px}
.cajabtn .go{color:var(--pink);font-weight:800}
.cajagrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cj{border-radius:12px;padding:10px 12px}
.cj .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.cj .v{font-size:22px;font-weight:800;margin-top:2px}
.cj.efe{background:var(--green-bg);color:var(--green)}
.cj.dig{background:var(--blue-bg);color:var(--blue)}
.cjrows{display:flex;flex-direction:column;gap:4px}
.cjrows div{display:flex;justify-content:space-between;font-size:14px}
.cjsub{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 4px}
.pgs{display:flex;flex-direction:column;gap:3px;background:var(--green-bg);border-radius:10px;padding:7px 10px;margin-bottom:4px}
.pgs div{display:flex;justify-content:space-between;font-size:13px;color:var(--green);font-weight:700}
.splitrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;margin-bottom:10px}
.itsel{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;max-height:220px;overflow-y:auto}
.itrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;font-weight:700}
.itrow.on{border-color:var(--pink);background:var(--pink-soft)}
.itrow small{color:var(--muted)}
.itrow .stepper b{min-width:30px;text-align:center;font-size:12px}
.topone{background:var(--pink-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.rank{display:flex;flex-direction:column;gap:10px}
.rk{display:flex;flex-direction:column;gap:4px}
.rkh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.rkn{font-weight:700;min-width:0}
.rkn b{color:var(--muted);font-weight:800;margin-right:2px}
.rkv{white-space:nowrap;color:var(--ink)}
.rkv b{font-size:16px}
.rkv small{color:var(--muted);font-weight:700;margin-left:4px}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:999px}
.rkvar{font-size:12px;color:var(--muted)}
.zcat{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.zchips{display:flex;flex-wrap:wrap;gap:6px}
.zchips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.zchips span.ag0{color:var(--red);border-style:dashed}
.rsel{display:flex;gap:6px;flex:1;min-width:0}
.rsel select,.rsel input{min-width:0}
.tools .rsel select,.tools .rsel input{flex:1;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.h2 .rsel{flex:0 1 auto;justify-content:flex-end}
.h2 .rsel input{font-size:13px;padding:5px 6px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700}
#tab-finanzas{order:4}#tab-equipo{order:5}#tab-ventas{order:3}#tab-pedidos{order:2}#tab-carta{order:0}#tab-pedido{order:1}
.finsum{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.finsum div{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.finsum .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.finsum .ln{height:1px;background:currentColor;opacity:.25}
.finsum .big b{font-size:24px;color:var(--pink)}
.finsum .sm{font-size:12px;opacity:.85;justify-content:flex-start;gap:4px}
.finbadge{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.fin3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fin3>div{border-radius:12px;padding:9px 10px}
.fin3 .k{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.fin3 .v{font-size:16px;font-weight:800}
.fin3 .r{background:var(--red-bg);color:var(--red)}.fin3 .a{background:var(--amber-bg);color:var(--amber)}.fin3 .n{background:var(--surface);border:1px solid var(--line)}
.fincard .meta{font-size:12px;color:var(--muted);font-weight:600}
.fincard .rkn{font-size:14px}
.fincard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:5px}
.linkbtn{border:0;background:transparent;font-weight:800;font-size:12px;color:var(--muted);padding:6px 4px;text-decoration:underline}
.linkbtn.danger{color:var(--red)}
.paybtn{border:1.5px solid var(--ink);background:var(--bg);border-radius:10px;padding:7px 14px;font-weight:800;font-size:13px}
.cron{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:6px}
.cq{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:13px;padding:5px 8px;border-radius:8px;background:var(--surface2)}
.cq span{font-weight:700}.cq b{font-weight:800}
.cq em{grid-column:1/-1;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.cq em:empty{display:none}
.cq.pagada{background:var(--green-bg)}.cq.pagada em{color:var(--green)}
.cq.vencida{background:var(--red-bg)}.cq.vencida em{color:var(--red)}
.cq.parcial,.cq.hoy{background:var(--amber-bg)}.cq.parcial em,.cq.hoy em{color:var(--amber)}
.dispbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;font-size:13px;font-weight:700}
.dispbar button{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
.dispbar button.on{background:var(--ink);color:var(--bg)}
.item .n{font-weight:700;font-size:13.5px;line-height:1.25}
.item .d{font-size:11.5px;color:var(--muted)}
.item .p{font-weight:800;color:var(--pink);font-size:14px}
.item.on .p{color:var(--ink)}
.item .q{position:absolute;top:-6px;right:-6px;background:var(--pink);color:var(--pink-ink);border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px}
.cartbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 10px 8px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px}
.cartbar button{background:var(--pink);color:var(--pink-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:800}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 8px}

/* ---------- pedido (carrito) ---------- */
.h2{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:18px;font-weight:800}
.h2 .edit{font-size:12px;background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:999px}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.line .ln{font-weight:700;font-size:14px}
.line .lp{font-weight:800;text-align:right}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:18px;line-height:1}
.stepper small{font-size:12px;color:var(--muted)}
.line input{grid-column:1/-1;border:0;border-top:1px dashed var(--line);background:transparent;font-size:13px;color:var(--muted);padding:6px 0 0;margin-top:2px}
.line input:focus{outline:none;color:var(--ink)}
.addmore{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:10px;font-weight:800;color:var(--muted);margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
label.f input,label.f select,label.f textarea{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:15px;color:var(--ink);width:100%}
label.f textarea{resize:vertical;min-height:44px}
.seg{display:flex;gap:5px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.checkout{position:sticky;bottom:-20px;margin:16px -16px -20px;padding:12px 16px 16px;background:var(--bg);border-top:1.5px solid var(--ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.total span{font-weight:700}
.total strong{font-size:26px;font-weight:800}
.saldo{font-size:13px;color:var(--muted);margin:-6px 0 8px;text-align:right}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:800;font-size:15px}
.btn.primary{background:var(--pink);color:var(--pink-ink);width:100%}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);width:100%;margin-top:8px;padding:10px}

/* ---------- lista de pedidos ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.kpi .v{font-size:20px;font-weight:800;margin-top:1px}
.tools{display:flex;gap:8px;margin:8px 0 2px}
.tools select,.tools button{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.orders{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--st)}
.order .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.order .no{font-family:"Chewy",cursive;font-size:22px;line-height:1}
.order .who{font-weight:700;font-size:14px}
.order .meta{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--stbg);color:var(--st);white-space:nowrap}
.order ul{margin:0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:3px}
.order li{display:flex;justify-content:space-between;gap:8px}
.order li em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.order .tot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;font-weight:800}

.paytag.ok{background:var(--green-bg);color:var(--green)}
.paytag.unpaid{background:var(--red-bg);color:var(--red)}
.paytag.half{background:var(--amber-bg);color:var(--amber)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.acts button,.acts a{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;font-weight:800;font-size:13px;text-decoration:none;color:var(--ink);text-align:center}
.acts .adv{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink);padding:11px}
.acts .wa{color:var(--green)}
.acts .danger{color:var(--red)}
.st-pendiente{--st:var(--amber);--stbg:var(--amber-bg)}
.st-preparando{--st:var(--blue);--stbg:var(--blue-bg)}
.st-listo{--st:var(--green);--stbg:var(--green-bg)}
.st-encamino{--st:var(--blue);--stbg:var(--blue-bg)}
.st-entregado{--st:var(--grey);--stbg:var(--grey-bg)}
.st-cancelado{--st:var(--red);--stbg:var(--red-bg)}
.confirm{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.confirm button{border:0;border-radius:8px;padding:7px 11px;font-weight:800}
.confirm .y{background:var(--red);color:#fff}
.confirm .n{background:var(--surface)}

/* ---------- hoja modal y aviso ---------- */
.modal{position:absolute;inset:0;background:rgba(20,15,18,.5);display:flex;align-items:flex-end;z-index:50}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 16px 20px;width:100%;border-top:2px solid var(--ink)}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 14px;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft)}
.row{display:flex;gap:8px}
.row .btn.ghost{margin-top:0;width:auto;flex:1}
.row .btn.primary{flex:2}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:72px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
/* ---------- acceso ---------- */
.gate{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:0 24px 24px}
.gate .hero{flex:0 0 auto;text-align:center;padding:56px 0 26px}
.gate .logo{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:var(--pink-soft);border:2px solid var(--ink);display:grid;place-items:center}
.gate .logo svg{width:46px;height:46px}
.gate h1{font-family:"Chewy","Comic Sans MS",cursive;font-weight:400;font-size:34px;margin:0;line-height:1}
.gate .hero .sub{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:6px}
.gate form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin:0 auto}
.gate .msg{font-size:13px;font-weight:700;border-radius:10px;padding:9px 11px}
.gate .msg.err{background:var(--red-bg);color:var(--red)}
.gate .msg.info{background:var(--surface2);color:var(--muted)}
.gate .foot{margin-top:auto;padding-top:24px;text-align:center;font-size:12px;color:var(--muted)}
.pw{position:relative}
.pw button{position:absolute;right:6px;bottom:6px;border:0;background:transparent;font-size:12px;font-weight:800;color:var(--muted);padding:6px}
.me{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:4px 2px;font-weight:800;font-size:13px;max-width:50%}
.me .av{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;border:1.5px solid var(--ink);position:relative}
.me .av.own{background:var(--ink);color:var(--bg)}
.me .av.kit,.acct .av.kit{border-color:var(--pink);border-style:dashed}
.me .av.dlv,.acct .av.dlv{border-color:var(--blue);border-style:dashed}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--green)}
.me .dot.local{background:var(--amber)}.me .dot.wait{background:var(--grey)}
.team{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.acct{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.acct .av{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:1.5px solid var(--ink)}
.acct .av.own{background:var(--ink);color:var(--bg)}
.acct .i{flex:1;min-width:0}
.acct .i b{display:block}
.acct .i span{font-size:12px;color:var(--muted)}
.acct button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-weight:800;font-size:12px;color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:15px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
/* ---------- mesas ---------- */
.order li.rh{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px;margin-top:3px}
.order li.rh:first-child{border-top:0;padding-top:0;margin-top:0}
.order li.rh.new{color:var(--pink)}
.mesas{margin:4px 0 2px}
.mesas button{border-color:var(--pink);color:var(--ink)}
.mesas .lbl{flex:0 0 auto;align-self:center;font-size:12px;font-weight:800;color:var(--muted);padding-right:2px}
.banner{grid-column:1/-1;background:var(--pink-soft);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:0;border-radius:9px;background:var(--pink);color:var(--pink-ink);padding:8px 12px;font-weight:800;font-size:13px}
.prev{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.prev b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="phone" id="phone">
  <header class="top">
    <div class="brand">la tiendita dulce<small>Recepción de pedidos</small></div>
    <button class="me" id="me" hidden aria-label="Mi sesión"></button><span id="sync" hidden></span>
  </header>
  <main id="app" class="screen"></main>
  <div id="bar" class="cartbar" hidden></div>
  <nav class="bottom" role="tablist" aria-label="Secciones">
    <button id="tab-carta" role="tab" data-view="carta" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Carta</button>
    <button id="tab-pedido" role="tab" data-view="pedido" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 5h2l2 11h10l2-8H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></svg>Pedido<span class="badge num" id="badge-cart" hidden>0</span></button>
    <button id="tab-pedidos" role="tab" data-view="pedidos" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/><path d="M9 2.5h6v3H9z"/></svg><span id="lbl-pedidos">Pedidos</span><span class="badge num" id="badge" hidden>0</span></button>
    <button id="tab-finanzas" role="tab" data-view="finanzas" aria-selected="false" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Finanzas<span class="badge num" id="badge-fin" hidden>0</span></button>
    <button id="tab-ventas" role="tab" data-view="ventas" aria-selected="false" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ventas</button>
    <button id="tab-equipo" role="tab" data-view="equipo" aria-selected="false" hidden>
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3 0 4 1.5 4.5 4"/></svg>Equipo</button>
  </nav>
  <div id="gate" class="gate"></div>
  <div id="modal"></div>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
/* ===================== CARTA ===================== */
const SABORES_POLLO=["BBQ","Acevichada","Maracuyá","Broster","Búfalo"];
const MENU=[
 {id:"hamb",t:"Hamburguesas y sándwiches",items:[
  ["Hamburguesa de carne",7],["Hamburguesa de pollo (a la plancha)",6],["Royal (carne + huevo)",8.5],["Hamburguesa de chorizo",6],
  ["Cheese burguer",9,"carne + queso fundido"],["Choricarne",9,"carne + chorizo"],["La bestia",11,"carne + chorizo + huevo"],
  ["Krispy (pollo broster)",8],["Huevi pollo",7.5],["Sándwich huevo, tomate y palta",7],["Sándwich pollo, jamón y queso",10],["Sándwich pollo, durazno, jamón y queso",12]]},
 {id:"pollo",t:"Pollo frito coreano",note:"20 trozos por porción",items:[
  ["Pollo coreano c/ papas · 1 sabor",15,"",{pick:1,from:SABORES_POLLO}],["Pollo coreano c/ papas · 2 sabores",18,"",{pick:2,from:SABORES_POLLO}],
  ["Pollo coreano c/ papas + chaufa · 1 sabor",18.5,"",{pick:1,from:SABORES_POLLO}],["Pollo coreano c/ papas + chaufa · 2 sabores",21.5,"",{pick:2,from:SABORES_POLLO}]]},
 {id:"jugos",t:"Jugos (con agua)",items:[["Jugo surtido",4],["Jugo de papaya",5],["Jugo de piña",6],["Jugo de mora",7],["Jugo de fresa",7],["Jugo de mango",7]]},
 {id:"batidos",t:"Batidos (con leche)",items:[["Batido de papaya",6],["Batido de plátano",6],["Batido de mora",8],["Batido de fresa",8],["Batido de mango",8],["Batido de melón",7],["Batido de lúcuma",10]]},
 {id:"frappes",t:"Frappés",items:[["Frappé de vainilla",13],["Frappé de chocolate",13],["Frappé de oreo",13],["Frappé de manjar blanco",14],["Frappé de fresa",14],["Frappé de mora",14],["Frappé de mango",14],["Frappé de frutos rojos",16]]},
 {id:"gaseosas",t:"Gaseosas",items:[["Inca Kola 300 ml",2],["Coca-Cola 300 ml",2],["Pepsi 500 ml",3],["Inca Kola 600 ml",4],["Coca-Cola 600 ml",4]]},
 {id:"postres",t:"Postres",items:[["Torta de chocolate",8],["Cheesecake de maracuyá",9],["Cheesecake de mora",9],["Cheesecake de fresa",9],["Crema volteada",7],["Pie de limón",7.5],["Torta helada de fresa",7.5],["Torta helada de piña",7.5],["Tiramisú de café",10],["Pastel Matilda",9],["Cajita de alfajores",5],["Brownie",5],["Kekito de limón",3],["Kekito de naranja",3],["Kekito banana y chocolate",3.5],["Tres leches clásica",8],["Tres leches de oreo",8.5],["Tiramisú de mango",10],["Cheesecake de oreo",10.5]]},
 {id:"galletas",t:"Galletas",items:[["Galleta Oreo",5],["Galleta Chocoteja",5],["Galleta Red velvet",5],["Galleta Pay de limón",6],["Galleta Tiramisú",6],["Galleta Beso de moza",6],["Galleta Tres leches",6],["Galleta Cheesecake de mora",6]]}
].map(c=>({...c,items:c.items.map(([n,p,d,o])=>({n,p,d:d||"",o:o||null}))}));

const ESTADOS=[
 {k:"pendiente",t:"Pendiente"},{k:"preparando",t:"Preparando"},{k:"listo",t:"Listo"},{k:"encamino",t:"En camino"},{k:"entregado",t:"Entregado"},{k:"cancelado",t:"Cancelado"}];
const NEXT={pendiente:"preparando",preparando:"listo",listo:"entregado",encamino:"entregado"};
const nextOf=o=>o.tipo==="Delivery"&&o.estado==="listo"?"encamino":NEXT[o.estado];
const ACTIVOS=["pendiente","preparando","listo","encamino"];
const TIPOS=["Para llevar","En local","Delivery"];
const METODOS=["Efectivo","Yape","Plin","Tarjeta","Transferencia"];

/* ===================== STATE ===================== */
const S={addTo:null,owner:false,creating:false,online:true,session:null,accounts:[],gateMode:"loading",gateMsg:null,acctForm:{nombre:"",usuario:"",clave:"",rol:"mesero"},view:"carta",cat:"all",q:"",cart:[],form:blankForm(),editing:null,orders:[],filter:"activos",range:"hoy",confirmDel:null,db:null,col:null};
function blankForm(){return{cliente:"",telefono:"",tipo:"Para llevar",detalle:"",metodo:"Efectivo",pago:"Pendiente",adelanto:"",notas:"",delivery:"",pagaCon:"",ubicacion:""}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"S/ "+(Math.round(n*100)/100).toFixed(2);
const cartTotal=()=>S.cart.reduce((a,l)=>a+l.p*l.q,0);
const delivFee=()=>S.form.tipo==="Delivery"?Math.max(Math.round((parseFloat(S.form.delivery)||0)*100)/100,0):0;
const orderTotal=()=>cartTotal()+delivFee();
const r2=n=>Math.round(n*100)/100;
function formDue(){const f=S.form,t=orderTotal();return f.pago==="Adelanto"?Math.min(parseFloat(f.adelanto)||0,t):t}
function formVuelto(){const pc=parseFloat(S.form.pagaCon);if(!(pc>0))return null;return r2(pc-formDue())}
function vueltoTxt(v){return v==null?"":v<0?`Faltan ${money(-v)}`:money(v)}
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const hhmm=d=>new Date(d).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ===================== FIREBASE ===================== */
const firebaseConfig={
  apiKey:"AIzaSyB5RfyPnvjyyaUyMdYF0aKPxRRyd7lSDxQ",
  authDomain:"tiendita-dulce.firebaseapp.com",
  projectId:"tiendita-dulce",
  storageBucket:"tiendita-dulce.firebasestorage.app",
  messagingSenderId:"168417793202",
  appId:"1:168417793202:web:52cad392942208f7a425ab"
};
const DOMINIO="tiendita-dulce.app";
const toEmail=u=>u.trim().toLowerCase()+"@"+DOMINIO;
let fbApp,auth,fdb,unsubOrders=null;
try{fbApp=firebase.initializeApp(firebaseConfig);auth=firebase.auth();fdb=firebase.firestore();S.db=fdb;S.col=fdb.collection("pedidos")}catch(e){console.error(e)}
const initials=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function fbErr(e){
  const c=e&&e.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return"Usuario o clave incorrectos.";
  if(/too-many-requests/.test(c))return"Demasiados intentos. Espera unos minutos.";
  if(/network/.test(c))return"Sin internet. Revisa tu conexión.";
  if(/email-already-in-use/.test(c))return"Ese usuario ya existe.";
  if(/weak-password/.test(c))return"La clave debe tener al menos 6 caracteres.";
  if(/permission-denied/.test(c))return"No tienes permiso para esta acción.";
  if(/api-key|configuration-not-found|operation-not-allowed/.test(c))return"Falta configurar Firebase (clave o método de ingreso).";
  return"No se pudo completar. Intenta otra vez.";
}

/* ---------- sesión ---------- */
function boot(){
  if(!auth){S.gateMode="login";S.gateMsg={t:"err",x:"No se pudo cargar el sistema. Revisa tu internet y recarga."};renderGate();return}
  auth.onAuthStateChanged(async user=>{
    if(!user){S.session=null;if(S.gateMode!=="setup")S.gateMode="login";renderGate();$("#gate").hidden=false;$("#me").hidden=true;return}
    if(S.creating)return;
    try{
      const d=await fdb.collection("cuentas").doc(user.uid).get();
      if(!d.exists||d.data().activo!==true){await auth.signOut();S.gateMsg={t:"err",x:"Esta cuenta no está activa. Habla con el propietario."};S.gateMode="login";renderGate();return}
      enter({id:user.uid,...d.data()});
    }catch(e){await auth.signOut();S.gateMsg={t:"err",x:fbErr(e)};renderGate()}
  });
}
let unsubDisp=null;
S.agotados=new Set();S.dispEdit=false;
function subscribeDisp(){
  if(unsubDisp)unsubDisp();
  unsubDisp=fdb.collection("config").doc("disponibilidad").onSnapshot(d=>{S.agotados=new Set((d.exists&&d.data().agotados)||[]);render()},e=>console.error(e));
}
const canEditDisp=()=>S.owner||S.cocina;
async function toggleAgotado(n){
  const set=new Set(S.agotados);set.has(n)?set.delete(n):set.add(n);
  S.agotados=set;render();
  try{await fdb.collection("config").doc("disponibilidad").set({agotados:[...set],updatedAt:Date.now(),por:S.session?.nombre||""})}
  catch(e){toast(fbErr(e))}
}
function subscribeOrders(){
  if(unsubOrders)unsubOrders();
  const q=S.owner
    ?S.col.where("createdAt",">=",Date.now()-45*86400e3).orderBy("createdAt","desc").limit(900)
    :S.col.where("createdAt",">=",startOfToday()).orderBy("createdAt","desc");
  unsubOrders=q.onSnapshot(snap=>{S.orders=snap.docs.map(d=>({id:d.id,...d.data()}));renderMe(true);render()},
    err=>{console.error(err);renderMe(false);toast(fbErr(err))});
}
function enter(acct){
  S.session=acct;S.owner=acct.rol==="propietario";S.cocina=acct.rol==="cocina";S.delivery=acct.rol==="delivery";if(S.delivery)S.dlvTab="pend";if(S.cocina)S.range="hoy";
  $("#gate").hidden=true;
  $("#tab-equipo").hidden=!S.owner;$("#tab-ventas").hidden=!S.owner;$("#tab-finanzas").hidden=!S.owner;
  $("#phone").style.setProperty("--tabs",S.owner?5:S.delivery?1:3);
  $("#tab-carta").hidden=S.delivery;$("#tab-pedido").hidden=S.delivery||S.owner;
  const lbl=document.getElementById("lbl-pedidos");if(lbl)lbl.textContent=S.delivery?"Mis deliverys":S.owner||S.cocina?"Pedidos":"Despacho";
  subscribeOrders();subscribeDisp();if(S.owner){subscribeFin();subscribeDeud();subscribePer();subscribeLista()}
  if(S.owner)loadAccounts();
  S.view=S.delivery?"pedidos":"carta";document.querySelectorAll("nav.bottom button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===S.view));
  renderMe(true);render();
  // al pasar la medianoche, el mesero vuelve a consultar solo lo del día
  clearInterval(enter._t);let dk=dayKey(Date.now());enter._t=setInterval(()=>{if(dayKey(Date.now())!==dk){dk=dayKey(Date.now());subscribeOrders()}},60000);
}
async function logout(){
  if(unsubOrders){unsubOrders();unsubOrders=null}
  if(unsubDisp){unsubDisp();unsubDisp=null}S.dispEdit=false;unsubscribeFin();unsubscribeDeud();unsubscribePer();unsubscribeLista();
  S.session=null;S.owner=false;S.cocina=false;S.delivery=false;S.despTab="despachar";S.orders=[];S.accounts=[];S.cart=[];S.form=blankForm();S.editing=null;S.addTo=null;
  $("#modal").innerHTML="";S.gateMode="login";S.gateMsg=null;
  try{await auth.signOut()}catch(e){}
}
function renderMe(ok){
  const me=$("#me"),a=S.session;if(!a){me.hidden=true;return}
  if(ok!==undefined)S.online=ok;
  me.hidden=false;
  me.innerHTML=`<span class="av${S.owner?" own":S.cocina?" kit":S.delivery?" dlv":""}">${esc(initials(a.nombre))}<i class="dot ${S.online===false?"local":""}"></i></span><span class="nm">${esc(a.nombre.split(" ")[0])}</span>`;
}
$("#me").onclick=()=>{
  const a=S.session;if(!a)return;
  const m=$("#modal");
  m.innerHTML=`<div class="modal" id="mbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Sesión">
    <h3>${esc(a.nombre)}</h3><p>Usuario: ${esc(a.usuario)}</p>
    <form id="pwform" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">

/* ===================== MESAS ===================== */
const mesaKey=s=>String(s||"").trim().toLowerCase().replace(/^mesa\s*/,"");
const mesaLabel=o=>o.tipo!=="En local"?(o.cliente?o.cliente.split(" ")[0]:o.tipo)+" · #"+o.numero:!mesaKey(o.detalle)?"Mesa s/n · #"+o.numero:/^\s*mesa/i.test(o.detalle)?o.detalle.trim():"Mesa "+o.detalle.trim();
const canAddRound=o=>!o.cerrada&&o.estado!=="cancelado"&&dayKey(o.createdAt)===dayKey(Date.now());
const isOpenMesa=o=>o.tipo==="En local"&&canAddRound(o);
const openMesas=()=>S.orders.filter(isOpenMesa).sort((a,b)=>mesaKey(a.detalle).localeCompare(mesaKey(b.detalle),"es",{numeric:true}));
const maxRound=o=>o.items.reduce((a,i)=>Math.max(a,i.r||1),1);
function startAddTo(id){S.addTo=id;S.editing=null;if(!S.cart.length)setView("carta");else setView("pedido")}
async function addRound(){
  const o=S.orders.find(x=>x.id===S.addTo);
  if(!o||!canAddRound(o)){toast("Ese pedido ya fue cerrado o cancelado");S.addTo=null;render();return}
  if(!S.cart.length)return;
  const r=maxRound(o)+1;
  const items=[...o.items.map(i=>({...i,r:i.r||1})),...S.cart.map(l=>({n:l.n,p:l.p,q:l.q,nota:l.nota.trim(),r,...(l.x?{x:true}:{})}))];
  const total=items.reduce((a,i)=>a+i.p*i.q,0)+(o.delivery||0),pag=o.pagado||0;
  const patch={items,total,updatedAt:Date.now(),
    estado:["listo","entregado"].includes(o.estado)?"pendiente":o.estado,
    pago:pag>=total-0.001?"Pagado":pag>0?"Adelanto":"Pendiente",
    rondas:[...(o.rondas||[]),{r,at:Date.now(),por:S.session?.nombre||"",porUid:S.session?.id||""}]};
  const btn=$("#send");if(btn)btn.disabled=true;
  try{
    await S.col.doc(o.id).update(patch);
  }catch(e){console.error(e);toast(fbErr(e));if(btn)btn.disabled=false;return}
  toast(`Ronda ${r} agregada a ${mesaLabel(o)}`);
  S.cart=[];S.addTo=null;S.form=blankForm();setView("carta");
}

/* ===================== DELIVERY / MAPAS ===================== */
function extractLoc(t){t=String(t||"").trim();if(!t)return"";const u=t.match(/https?:\/\/\S+/);if(u)return u[0];const c=t.match(/-?\d{1,2}\.\d{3,}\s*,\s*-?\d{1,3}\.\d{3,}/);return c?c[0].replace(/\s+/g,""):t.slice(0,200)}
function locCoords(o){const t=o.ubicacion||"";let m=t.match(/(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/);if(m)return[m[1],m[2]];m=t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);return m?[m[1],m[2]]:null}
function mapsHref(o){const c=locCoords(o);if(c)return`https://www.google.com/maps/search/?api=1&query=${c[0]},${c[1]}`;if(/^https?:\/\//.test(o.ubicacion||""))return o.ubicacion;return o.detalle?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.detalle+", Tumbes, Perú")}`:""}
function wazeHref(o){const c=locCoords(o);if(c)return`https://waze.com/ul?ll=${c[0]},${c[1]}&navigate=yes`;if(o.detalle&&!/^https?:/.test(o.ubicacion||""))return`https://waze.com/ul?q=${encodeURIComponent(o.detalle+", Tumbes")}&navigate=yes`;return""}
function telDigits(o){let p=(o.telefono||"").replace(/\D/g,"");if(p.length===9)p="+51"+p;return p}
function renderDelivery(){
  const today=dayKey(Date.now()),all=S.orders.filter(o=>o.tipo==="Delivery"&&dayKey(o.createdAt)===today&&o.estado!=="cancelado");
  const rank={encamino:0,listo:1,preparando:2,pendiente:3};
  const pend=all.filter(o=>o.estado!=="entregado").sort((a,b)=>rank[a.estado]-rank[b.estado]||a.createdAt-b.createdAt);
  const done=all.filter(o=>o.estado==="entregado").sort((a,b)=>b.createdAt-a.createdAt);
  const tab=S.dlvTab||"pend",list=tab==="pend"?pend:done;

}
function dlvBlock(o){

  </div>`;

function renderCaja(){
  const base=S.orders.filter(inRange).filter(o=>o.estado!=="cancelado"&&(o.pagado||0)>0);
  const by={},per={};let efe=0,dig=0,vta=0;

const RUBROS=["Frutas","Lácteos","Carnes","Panadería","Descartables","Bebidas","Limpieza","Otros"];
const PAGOS_COMPRA=["Efectivo","Yape","Plin","Transferencia","Crédito"];
const TIPOS_OBL=["Única","Mensual","Quincenal"];
S.compras=[];S.obligs=[];S.finTab="compras";S.finMes=0;S.finConfirm=null;
let unsubCompras=null,unsubObligs=null;
const ymdToDate=s=>new Date(String(s||dayKey(Date.now()))+"T12:00:00");
const addDaysYmd=(s,n)=>{const d=ymdToDate(s);d.setDate(d.getDate()+n);return dayKey(d)};
const addMonthYmd=s=>{const d=ymdToDate(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dayKey(d)};
const daysTo=s=>Math.round((ymdToDate(s).getTime()-ymdToDate(dayKey(Date.now())).getTime())/86400000);
function mesRange(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(1);d.setMonth(d.getMonth()-off);const a=d.getTime();const e=new Date(d);e.setMonth(e.getMonth()+1);return[a,e.getTime(),d]}
const mesNombre=off=>mesRange(off)[2].toLocaleDateString("es-PE",{month:"long",year:"numeric"});
function subscribeFin(){
  if(!S.owner)return;
  if(unsubCompras)unsubCompras();if(unsubObligs)unsubObligs();
  unsubCompras=fdb.collection("compras").where("fecha",">=",mesRange(1)[0]).orderBy("fecha","desc").limit(600)
    .onSnapshot(q=>{S.compras=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==="finanzas")render()},e=>{console.error(e);toast(fbErr(e))});
  unsubObligs=fdb.collection("obligaciones").orderBy("vence","desc").limit(400)
    .onSnapshot(q=>{S.obligs=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==="finanzas")render()},e=>{console.error(e);toast(fbErr(e))});
}
function unsubscribeFin(){if(unsubCompras){unsubCompras();unsubCompras=null}if(unsubObligs){unsubObligs();unsubObligs=null}S.compras=[];S.obligs=[]}
function finCalc(off){
  const [a,b]=mesRange(off),inM=t=>t>=a&&t<b;
  let ventas=0;
  S.orders.filter(o=>o.estado!=="cancelado").forEach(o=>pagosOf(o).forEach(p=>{if(inM(p.at||o.createdAt))ventas+=p.monto||0}));
  const comprasMes=S.compras.filter(c=>inM(c.fecha));
  const sumCompras=comprasMes.reduce((x,c)=>x+c.total,0);
  const sumCredito=comprasMes.filter(c=>c.pago==="Crédito").reduce((x,c)=>x+c.total,0);
  const comprasContado=sumCompras-sumCredito;
  const pagadasMes=S.obligs.filter(o=>o.pagado&&inM(o.pagadoAt||0));
  const oblPagadas=pagadasMes.reduce((x,o)=>x+o.monto,0);
  const finMes=dayKey(new Date(b-86400000));
  const pendMes=S.obligs.filter(o=>!o.pagado&&o.vence<=finMes);
  const rub={};comprasMes.forEach(c=>rub[c.rubro]=(rub[c.rubro]||0)+c.total);
  let abonos=0;(S.deudores||[]).forEach(x=>(x.abonos||[]).forEach(b=>{if(inM(b.at))abonos+=b.monto||0}));
  const nosDeben=(S.deudores||[]).reduce((t,x)=>t+saldoDe(x),0);
  const rem=remCalc(off).total;
  return{ventas,abonos,nosDeben,sumCompras,sumCredito,comprasContado,oblPagadas,rem,queda:ventas+abonos-comprasContado-oblPagadas-rem,
    pendMes:pendMes.reduce((x,o)=>x+o.monto,0),comprasMes,rub,pagadasMes,a,b};
}

async function finClick(d){
  const k=d.fin;
  if(/^li[A-Z]/.test(k))return listaClick(d);
  if(k==="nuevaCompra")return openCompraForm();
  if(k==="nuevaObl")return openOblForm();
  if(k==="pay")return openPagarObl(d.id);
  if(k==="nuevaDeuda")return openDeudaForm();
  if(k==="abono")return openAbono(d.id);
  if(k==="debToggle"){S.debOpen=S.debOpen===d.id?null:d.id;S.finConfirm=null;render();return}
  if(k==="delDeud"){S.finConfirm="d:"+d.id;render();return}
  if(k==="cancelDel"){S.finConfirm=null;render();return}
  if(k==="perNuevo")return openPerForm();
  if(k==="perEdit")return openPerForm(d.id);
  if(k==="perPagar")return openPagoPersonal(d.id);
  if(k==="perAdel")return openAdelanto(d.id);
  if(k==="perDia")return openPagoDia();
  if(k==="perToggle"){S.perOpen=S.perOpen===d.id?null:d.id;render();return}
  if(k==="perAct"){const w=S.personal.find(x=>x.id===d.id);if(!w)return;try{await fdb.collection("personal").doc(w.id).update({activo:w.activo===false});toast(w.activo===false?"Trabajador reactivado":"Trabajador desactivado")}catch(e){toast(fbErr(e))}return}
  if(k==="delCompra"){S.finConfirm="c:"+d.id;render();return}
  if(k==="delObl"){S.finConfirm="o:"+d.id;render();return}
  try{
    if(k==="delCompraOk"){S.finConfirm=null;const c=S.compras.find(x=>x.id===d.id);const b=fdb.batch();b.delete(fdb.collection("compras").doc(d.id));
      if(c&&c.obligacionId){const ob=S.obligs.find(x=>x.id===c.obligacionId);if(ob&&!ob.pagado)b.delete(fdb.collection("obligaciones").doc(c.obligacionId))}
      if(c&&c.listaId&&S.lista.find(x=>x.id===c.listaId&&x.compraId===c.id))b.update(fdb.collection("listaCompras").doc(c.listaId),{hecho:false,compraId:"",compradoAt:0});
      await b.commit();toast("Compra borrada");return}
    if(k==="delDeudOk"){S.finConfirm=null;S.debOpen=null;await fdb.collection("porCobrar").doc(d.id).delete();toast("Deuda borrada");return}
    if(k==="delOblOk"){S.finConfirm=null;await fdb.collection("obligaciones").doc(d.id).delete();toast("Obligación borrada");return}
    if(k==="unpay"){await fdb.collection("obligaciones").doc(d.id).update({pagado:false,pagadoAt:0,metodo:""});toast("Marcado como pendiente");return}
  }catch(e){toast(fbErr(e))}
  if(k==="xls")return exportFinanzas();
}

S.deudores=[];S.debOpen=null;let unsubDeud=null;
function subscribeDeud(){
  if(!S.owner)return;if(unsubDeud)unsubDeud();
  unsubDeud=fdb.collection("porCobrar").orderBy("creado","desc").limit(400)
    .onSnapshot(q=>{S.deudores=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==="finanzas")render()},e=>{console.error(e);toast(fbErr(e))});
}
function unsubscribeDeud(){if(unsubDeud){unsubDeud();unsubDeud=null}S.deudores=[]}
const abonado=x=>r2((x.abonos||[]).reduce((a,b)=>a+(b.monto||0),0));
const saldoDe=x=>Math.max(r2(x.monto-abonado(x)),0);
function cronograma(x){
  // reparte lo abonado sobre las cuotas en orden
  let rest=abonado(x);
  return (x.cuotas||[]).map((c,i)=>{const pag=Math.min(rest,c.monto);rest=r2(rest-pag);const falta=r2(c.monto-pag);const d=daysTo(c.vence);
    return{i:i+1,vence:c.vence,monto:c.monto,pag:r2(pag),falta,estado:falta<=0.001?"pagada":pag>0?"parcial":d<0?"vencida":d===0?"hoy":"pendiente",dias:d}});
}
function proxCuota(x){return cronograma(x).find(c=>c.falta>0.001)||null}
function genCuotas(total,n,cada,primera){
  n=Math.max(1,Math.min(52,n|0));const base=Math.floor(total/n*100)/100;const out=[];let acc=0;
  for(let i=0;i<n;i++){const m=i===n-1?r2(total-acc):base;acc=r2(acc+m);out.push({vence:addDaysYmd(primera,i*cada),monto:m})}
  return out;
}
function deudaCard(x){
  const ab=abonado(x),sal=saldoDe(x),pct=x.monto>0?Math.min(100,Math.round(ab/x.monto*100)):0,pc=proxCuota(x),open=S.debOpen===x.id;
  const col=sal<=0.001?"var(--green)":pc&&pc.dias<0?"var(--red)":pc&&pc.dias<=3?"var(--amber)":"var(--muted)";
  const prox=sal<=0.001?"Deuda cancelada ✓":pc?(pc.dias<0?`Cuota ${pc.i} vencida hace ${-pc.dias} día${pc.dias===-1?"":"s"} · falta ${money(pc.falta)}`:pc.dias===0?`Cuota ${pc.i} vence hoy · ${money(pc.falta)}`:`Próxima: cuota ${pc.i} · ${money(pc.falta)} el ${ymdToDate(pc.vence).toLocaleDateString("es-PE",{day:"numeric",month:"short"})}`):"";
  const tel=(x.telefono||"").replace(/\D/g,"");
  const wa=tel?`https://wa.me/${tel.length===9?"51"+tel:tel}?text=${encodeURIComponent(`Hola ${x.n.split(" ")[0]}, te saludamos de La Tiendita Dulce. Te recordamos que tienes un saldo pendiente de ${money(sal)}${pc?`; la próxima cuota es de ${money(pc.falta)} con fecha ${ymdToDate(pc.vence).toLocaleDateString("es-PE",{day:"numeric",month:"long"})}`:""}. ¡Gracias!`)}`:"";
  return`<article class="fincard" style="border-left:5px solid ${col}">
    <div class="rkh"><span class="rkn">${esc(x.n)}</span><b class="num">${money(sal)}</b></div>
    <div class="meta">${esc(x.concepto||"Deuda")} · total ${money(x.monto)} · desde ${ymdToDate(x.fecha).toLocaleDateString("es-PE",{day:"numeric",month:"short"})}</div>
    <div class="bar" title="${pct}% pagado"><i style="width:${pct}%;background:var(--green)"></i></div>
    <div class="rkh"><span style="font-size:12px;font-weight:800;color:${col}">${prox}</span><span class="meta num">${pct}% · abonó ${money(ab)}</span></div>
    ${open?`<div class="cron">
      ${(x.cuotas||[]).length>1?`<div class="cjsub" style="margin-top:4px">Cronograma de pagos</div>${cronograma(x).map(c=>`<div class="cq ${c.estado}"><span>Cuota ${c.i} · ${ymdToDate(c.vence).toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"})}</span><b class="num">${money(c.monto)}</b><em>${c.estado==="pagada"?"Pagada":c.estado==="parcial"?"Falta "+money(c.falta):c.estado==="vencida"?"Vencida":c.estado==="hoy"?"Hoy":"Pendiente"}</em></div>`).join("")}`:""}
      <div class="cjsub">Abonos recibidos</div>
      ${(x.abonos||[]).length?(x.abonos||[]).slice().sort((p,q)=>q.at-p.at).map(b=>`<div class="cq pagada"><span>${new Date(b.at).toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"})} · ${esc(b.metodo)}${b.por?" · "+esc(String(b.por).split(" ")[0]):""}</span><b class="num">${money(b.monto)}</b><em>${b.nota?esc(b.nota):""}</em></div>`).join(""):`<div class="meta">Todavía no hay abonos.</div>`}
      ${x.telefono?`<div class="meta">Celular: ${esc(x.telefono)}</div>`:""}
      ${S.finConfirm==="d:"+x.id?`<div class="confirm">¿Borrar la deuda de ${esc(x.n)}? <button class="y" data-fin="delDeudOk" data-id="${x.id}">Sí, borrar</button><button class="n" data-fin="cancelDel">No</button></div>`:`<div style="text-align:right"><button class="linkbtn danger" data-fin="delDeud" data-id="${x.id}">Borrar deuda</button></div>`}
    </div>`:""}
    <div class="acts" style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr))">
      ${sal>0.001?`<button class="adv" data-fin="abono" data-id="${x.id}" style="grid-column:auto">Registrar abono</button>`:""}
      <button data-fin="debToggle" data-id="${x.id}">${open?"Ocultar detalle":"Ver detalle"}</button>
      ${wa&&sal>0.001?`<a class="wa" href="${wa}" target="_blank" rel="noopener">Recordar</a>`:""}
    </div>
  </article>`;
}
function renderNosDeben(){
  const act=S.deudores.filter(x=>saldoDe(x)>0.001),done=S.deudores.filter(x=>saldoDe(x)<=0.001);
  const tot=act.reduce((a,x)=>a+saldoDe(x),0);
  let venc=0,sem=0;act.forEach(x=>cronograma(x).forEach(c=>{if(c.falta>0.001){if(c.dias<0)venc+=c.falta;else if(c.dias<=7)sem+=c.falta}}));
  const ord=act.slice().sort((p,q)=>{const a=proxCuota(p),b=proxCuota(q);return(a?a.vence:"9")<(b?b.vence:"9")?-1:1});

     <div class="a"><div class="k">Cobrar 7 días</div><div class="v num">${money(sem)}</div></div>

const adelPend=w=>(w.adelantos||[]).filter(a=>!a.descontado);

function montoHoras(w,h){
  h=Math.max(0,parseFloat(h)||0);const J=jornadaH(w);
  if(h>=J)return{base:pagoDia(w),extra:r2((h-J)*pagoHora(w)),total:r2(pagoDia(w)+(h-J)*pagoHora(w))};
  return{base:r2(h*pagoHora(w)),extra:0,total:r2(h*pagoHora(w))};

const fmtD=(s,o)=>ymdToDate(s).toLocaleDateString("es-PE",o||{day:"numeric",month:"short"});
const fmtH=h=>{const n=Math.round(h*100)/100;return(n%1?n.toFixed(2).replace(/0$/,""):n)+" h"};

function remCalc(off){
  const [a,b]=mesRange(off),inM=t=>t>=a&&t<b;
  const netos=S.remus.filter(r=>inM(r.at)).reduce((t,r)=>t+r.neto,0);
  let adel=0;S.personal.forEach(w=>(w.adelantos||[]).forEach(x=>{if(inM(x.at))adel+=x.monto}));
  return{netos:r2(netos),adel:r2(adel),total:r2(netos+adel)};
}

    ${ina.length?`<div class="zcat">Inactivos</div><div class="orders">${ina.map(perCard).join("")}</div>`:""}
    <div class="note" style="margin-top:10px">Jornada completa = pago del día; cada hora adicional se paga a la tarifa por hora. Si trabaja menos horas, se paga solo las horas. Los adelantos se descuentan solos del siguiente pago.</div>`;

/* Saldo pendiente de adelantos (soporta descuentos parciales) */
const adelResta=a=>a.descontado?0:(a.resta!=null?a.resta:a.monto);
const adelRestaSum=w=>r2((w.adelantos||[]).reduce((t,a)=>t+adelResta(a),0));
/* Aplica un descuento de "monto" a los adelantos (más antiguos primero) */
function aplicarAdel(w,monto){
  let rest=r2(monto);
  return(w.adelantos||[]).map(a=>{const r=adelResta(a);if(rest<=0.001||r<=0)return a;const d=Math.min(r,rest);rest=r2(rest-d);const nr=r2(r-d);return{...a,resta:nr,descontado:nr<=0.001}});
}

    const keep=()=>{f.fecha=$("#pp-d").value||f.fecha;f.horas=$("#pp-hr").value;f.bonos=$("#pp-bo").value;f.desc=$("#pp-de").value;f.nota=$("#pp-n").value;if($("#pp-ad"))f.usarAdel=$("#pp-ad").checked};

/* Pago del día a todo el equipo en un solo paso */
function openPagoDia(){
  const act=S.personal.filter(w=>w.activo!==false);if(!act.length)return;
  const st={fecha:dayKey(Date.now()),met:"Efectivo",rows:{}};
  const init=()=>{act.forEach(w=>{const ya=pagadoEl(w,st.fecha).length>0;st.rows[w.id]={on:!ya,h:String(jornadaH(w)),ya}})};init();
  const rowCalc=w=>{const r=st.rows[w.id],mh=montoHoras(w,r.h),ad=r2(Math.max(0,Math.min(adelRestaSum(w),mh.total)));return{mh,ad,neto:r2(mh.total-ad)}};
  const totHtml=()=>{const sel=act.filter(w=>st.rows[w.id].on);const t=sel.reduce((s,w)=>s+rowCalc(w).neto,0);return`${sel.length} persona${sel.length===1?"":"s"} · <b class="num">${money(t)}</b>`};
  const rowHtml=w=>{const r=st.rows[w.id],c=rowCalc(w);return`<div class="pdrow" data-w="${w.id}" style="display:grid;grid-template-columns:28px 1fr 70px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);${r.on?"":"opacity:.55"}">
      <input type="checkbox" data-pdc="${w.id}" ${r.on?"checked":""} style="width:22px;height:22px">
      <div><div style="font-weight:800">${esc(w.nombre)}${r.ya?` <span class="paytag ok" style="font-size:10px">ya pagado</span>`:""}</div>
        <div class="meta" id="pdm-${w.id}">${c.mh.extra?`Jornada + ${fmtH((parseFloat(r.h)||0)-jornadaH(w))} extra`:(parseFloat(r.h)||0)>=jornadaH(w)?"Jornada completa":`${fmtH(parseFloat(r.h)||0)} × ${money(pagoHora(w))}`}${c.ad?` − adel. ${money(c.ad)}`:""} = <b class="num">${money(c.neto)}</b></div></div>
      <label class="f" style="margin:0"><span style="font-size:10px">Horas</span><input data-pdh="${w.id}" inputmode="decimal" value="${esc(r.h)}" style="padding:8px;text-align:center"></label>
    </div>`};
  const draw=()=>{
    const m=sheet(`<h3>Pagar el día</h3><p>Marca quiénes trabajaron y cuántas horas.</p>
      <div class="fields"><label class="f full"><span>Día trabajado</span><input id="pd-f" type="date" value="${st.fecha}"></label></div>
      <div id="pd-rows">${act.map(rowHtml).join("")}</div>
      <div class="cjsub">Con qué se paga</div>${chipsHtml(METS,st.met,"mt")}
      <div class="cjrows"><div style="font-size:17px"><span><b>Total a pagar</b></span><span id="pd-tot">${totHtml()}</span></div></div>
      <div class="note" style="margin:6px 0 10px">Los adelantos pendientes se descuentan solos. Para bonos o descuentos usa “Pagar” en la tarjeta de cada uno.</div>
      <div class="row"><button class="btn ghost" id="pd-x">Cancelar</button><button class="btn primary" id="pd-ok">Registrar pagos</button></div>`);
    const upd=id=>{const w=act.find(x=>x.id===id);const row=m.querySelector(`[data-w="${id}"]`);const tmp=document.createElement("div");tmp.innerHTML=rowHtml(w);row.querySelector("#pdm-"+id).innerHTML=tmp.querySelector("#pdm-"+id).innerHTML;row.style.opacity=st.rows[id].on?"1":".55";$("#pd-tot").innerHTML=totHtml()};
    m.querySelectorAll("[data-pdh]").forEach(i=>i.oninput=()=>{const id=i.dataset.pdh;st.rows[id].h=i.value;if((parseFloat(i.value)||0)>0&&!st.rows[id].on){st.rows[id].on=true;m.querySelector(`[data-pdc="${id}"]`).checked=true}upd(id)});
    m.querySelectorAll("[data-pdc]").forEach(c=>c.onchange=()=>{st.rows[c.dataset.pdc].on=c.checked;upd(c.dataset.pdc)});
    $("#pd-f").onchange=()=>{st.fecha=$("#pd-f").value||st.fecha;init();draw()};
    m.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{st.met=b.dataset.mt;m.querySelectorAll("[data-mt]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#pd-x").onclick=()=>m.innerHTML="";
    $("#pd-ok").onclick=async()=>{
      const sel=act.filter(w=>st.rows[w.id].on);
      if(!sel.length){toast("Marca al menos a una persona");return}
      const bad=sel.find(w=>{const h=parseFloat(st.rows[w.id].h)||0;return!(h>0&&h<=24)});if(bad){toast("Revisa las horas de "+bad.nombre);return}
      const dup=sel.filter(w=>st.rows[w.id].ya);
      if(dup.length&&!st.confDup){st.confDup=true;toast(`${dup.map(w=>w.nombre.split(" ")[0]).join(", ")} ya tiene pago ese día. Toca otra vez para confirmar.`);return}
      $("#pd-ok").disabled=true;
      try{
        const batch=fdb.batch();let tot=0;
        sel.forEach(w=>{const c=rowCalc(w);tot+=c.neto;batch.set(fdb.collection("remuneraciones").doc(),remDoc(w,st.fecha,st.rows[w.id].h,c.mh,0,c.ad,0,st.met,""));
          if(c.ad>0)batch.update(fdb.collection("personal").doc(w.id),{adelantos:aplicarAdel(w,c.ad)})});
        await batch.commit();m.innerHTML="";toast(`Pagos registrados: ${money(tot)}`);
      }catch(e){toast(fbErr(e));const b=$("#pd-ok");if(b)b.disabled=false}
    };
  };draw();
}

/* ===================== LISTA DE COMPRAS (por lugar / lote) ===================== */
const LUGARES_BASE=["Mercado","Huaquillas"];

      ${open?`<div style="padding:4px 14px 12px">${its.map(itemLinea).join("")}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">

          <button class="btn primary" data-fin="liLote" data-l="${esc(l)}" style="padding:10px">Registrar lote comprado</button>

    ${hechos.length?`<button class="linkbtn" data-fin="liHechos" style="margin-top:12px">${S.listaHechos?"Ocultar":"Ver"} lo ya comprado (${hechos.length})</button>
      ${S.listaHechos?`<div class="fincard" style="margin-top:8px">${hechos.map(itemLinea).join("")}<div style="text-align:right;margin-top:8px"><button class="linkbtn danger" data-fin="liLimpiar">Borrar comprados de la lista</button></div></div>`:""}`:""}

      <div class="cjsub" style="margin-top:0">Rubro</div>${chipsHtml(RUBROS,f.rubro,"rub")}
      <div class="fields">
       <label class="f"><span>Costo aprox. (S/) · opcional</span><input id="li-e" inputmode="decimal" value="${esc(f.estimado)}" placeholder="0.00"></label>
       <label class="f"><span>Nota</span><input id="li-n" value="${esc(f.nota)}" maxlength="50" placeholder="Ej. bien maduras"></label>
      </div>
      <div class="row" style="margin-top:12px">${x?`<button class="btn ghost" id="li-del" style="color:var(--red)">Quitar</button>`:`<button class="btn ghost" id="li-x">Cancelar</button>`}<button class="btn primary" id="li-ok">${x?"Guardar":"Agregar"}</button></div>

/* Registrar varias cosas de un mismo lugar como compras, de una vez */
function openLote(lugar){
  const its=listaPend().filter(x=>(x.lugar||"Sin lugar")===lugar);if(!its.length)return;
  const st={pago:"Efectivo",comp:"Ninguno",vence:addDaysYmd(dayKey(Date.now()),15),rows:{}};
  its.forEach(x=>st.rows[x.id]={on:true,total:x.estimado?String(x.estimado):"",cant:x.cant?String(x.cant):""});
  const tot=()=>its.filter(x=>st.rows[x.id].on).reduce((t,x)=>t+(parseFloat(st.rows[x.id].total)||0),0);
  const draw=()=>{
    const m=sheet(`<h3>Lote comprado · ${esc(lugar)}</h3><p>Pon lo que realmente pagaste por cada cosa. Desmarca lo que no conseguiste.</p>
      ${its.map(x=>{const r=st.rows[x.id];return`<div style="display:grid;grid-template-columns:28px 1fr 64px 84px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);${r.on?"":"opacity:.5"}">
        <input type="checkbox" data-lc="${x.id}" ${r.on?"checked":""} style="width:22px;height:22px">
        <div style="font-weight:800;font-size:14px">${esc(x.prod)}<div class="meta">${esc(x.und||"und")}${x.estimado?` · aprox. ${money(x.estimado)}`:""}</div></div>
        <label class="f" style="margin:0"><span style="font-size:10px">Cant.</span><input data-lq="${x.id}" inputmode="decimal" value="${esc(r.cant)}" style="padding:8px;text-align:center"></label>
        <label class="f" style="margin:0"><span style="font-size:10px">Pagó S/</span><input data-lt="${x.id}" inputmode="decimal" value="${esc(r.total)}" placeholder="0.00" style="padding:8px;text-align:right"></label>
      </div>`}).join("")}
      <div class="cjsub">Cómo se pagó</div>${chipsHtml(PAGOS_COMPRA,st.pago,"pg")}
      ${st.pago==="Crédito"?`<label class="f" style="margin-bottom:10px"><span>Vence el pago</span><input id="lt-v" type="date" value="${st.vence}"></label>`:""}
      <div class="cjsub" style="margin-top:0">Comprobante</div>${chipsHtml(["Ninguno","Boleta","Factura"],st.comp,"cpb")}
      <div class="cjrows" style="margin:6px 0 12px"><div style="font-size:18px"><span><b>Total del lote</b></span><b class="num" id="lt-tot">${money(tot())}</b></div></div>
      <div class="row"><button class="btn ghost" id="lt-x">Cancelar</button><button class="btn primary" id="lt-ok">Registrar en Compras</button></div>`);
    const upd=()=>{$("#lt-tot").textContent=money(tot())};
    m.querySelectorAll("[data-lt]").forEach(i=>i.oninput=()=>{st.rows[i.dataset.lt].total=i.value;upd()});
    m.querySelectorAll("[data-lq]").forEach(i=>i.oninput=()=>{st.rows[i.dataset.lq].cant=i.value});
    m.querySelectorAll("[data-lc]").forEach(c=>c.onchange=()=>{st.rows[c.dataset.lc].on=c.checked;c.parentElement.style.opacity=c.checked?"1":".5";upd()});
    const v=$("#lt-v");if(v)v.onchange=()=>{st.vence=v.value||st.vence};
    m.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{st.pago=b.dataset.pg;draw()});
    m.querySelectorAll("[data-cpb]").forEach(b=>b.onclick=()=>{st.comp=b.dataset.cpb;draw()});
    $("#lt-x").onclick=()=>m.innerHTML="";
    $("#lt-ok").onclick=async()=>{
      const sel=its.filter(x=>st.rows[x.id].on);
      if(!sel.length){toast("Marca al menos una cosa");return}
      const sinMonto=sel.find(x=>!(parseFloat(st.rows[x.id].total)>0));if(sinMonto){toast("Falta lo que pagaste por "+sinMonto.prod);return}
      $("#lt-ok").disabled=true;
      try{
        const batch=fdb.batch(),now=Date.now();let total=0;const compraIds=[];
        sel.forEach(x=>{const r=st.rows[x.id],t=r2(parseFloat(r.total)),ref=fdb.collection("compras").doc();total+=t;compraIds.push(ref.id);
          batch.set(ref,{fecha:now,rubro:x.rubro||"Otros",prod:x.prod,cant:parseFloat(r.cant)||1,und:x.und||"und",total:t,prov:lugar,pago:st.pago,comprobante:st.comp,por:S.session?.nombre||"",listaId:x.id});
          batch.update(fdb.collection("listaCompras").doc(x.id),{hecho:true,compraId:ref.id,compradoAt:now,pagado:t})});
        if(st.pago==="Crédito"){const ob=fdb.collection("obligaciones").doc();
          batch.set(ob,{n:lugar+" · lote de "+sel.length+" productos",tipo:"Compra a crédito",monto:r2(total),vence:st.vence,pagado:false,compraIds,creado:now})}
        await batch.commit();m.innerHTML="";toast(`Lote registrado: ${money(total)}`);
      }catch(e){toast(fbErr(e));const b=$("#lt-ok");if(b)b.disabled=false}
    };
  };draw();
}

async function listaClick(d){
  const k=d.fin;

  if(k==="liLote")return openLote(d.l);
  if(k==="liWa")return listaWhatsApp(d.l);
  if(k==="liLugar"){S.lugarOpen[d.l]=S.lugarOpen[d.l]===false;render();return}
  if(k==="liHechos"){S.listaHechos=!S.listaHechos;render();return}
  if(k==="liComprar"){const x=S.lista.find(i=>i.id===d.id);if(!x||x.hecho)return;
    return openCompraForm({rubro:x.rubro||"Otros",prod:x.prod,cant:x.cant?String(x.cant):"",und:x.und||"und",total:x.estimado?String(x.estimado):"",prov:x.lugar||"",listaId:x.id})}
  try{
    if(k==="liDeshacer"){await fdb.collection("listaCompras").doc(d.id).update({hecho:false,compraId:"",compradoAt:0});toast("Vuelve a la lista (la compra registrada se mantiene; bórrala en Compras si fue un error)");return}
    if(k==="liLimpiar"){const b=fdb.batch();S.lista.filter(x=>x.hecho).forEach(x=>b.delete(fdb.collection("listaCompras").doc(x.id)));await b.commit();S.listaHechos=false;toast("Lista limpia");return}
  }catch(e){toast(fbErr(e))}
}

/* ===================== COBRO / VUELTO ===================== */
function pagosOf(o){
  if(o.pagos&&o.pagos.length)return o.pagos;
  return (o.pagado||0)>0?[{m:o.metodo||"Efectivo",monto:o.pagado,pagaCon:o.pagaCon||0,vuelto:o.vuelto||0,por:o.cobradoPor||o.atendio||"",at:o.cobradoAt||o.createdAt}]:[];
}
function metodoLabel(o){const ms=[...new Set(pagosOf(o).map(p=>p.m))];return ms.length>1?"Mixto":ms[0]||o.metodo||"Efectivo"}
function openCobro(id,st){
  st=st||{};
  const m=$("#modal");
  let mode=st.mode||"todo",n=st.n||2,sel=st.sel||{},otro="",pc="",met=st.met||"Efectivo";
  const draw=()=>{
    const o=S.orders.find(x=>x.id===id);if(!o){m.innerHTML="";return}
    const saldo=r2(o.total-(o.pagado||0)),prev=pagosOf(o);
    if(saldo<=0.001){m.innerHTML="";return}
    let monto=mode==="todo"?saldo:mode==="dividir"?(n<=1?saldo:r2(saldo/n)):mode==="items"?r2(o.items.reduce((a,i,ix)=>a+i.p*(sel[ix]||0),0)):r2(parseFloat(otro)||0);
    if(mode==="items"&&o.delivery&&sel.dlv)monto=r2(monto+o.delivery);
    const over=monto>saldo+0.001,valid=monto>0&&!over;
    const efectivo=met==="Efectivo";
    const v=efectivo&&parseFloat(pc)>0?r2(parseFloat(pc)-monto):null;
    const bills=[10,20,50,100,200].filter(b=>b>=monto).slice(0,4);
    const cierra=valid&&Math.abs(monto-saldo)<0.001;
    m.innerHTML=`<div class="modal" id="mbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Cobrar" style="max-height:92%;overflow-y:auto">
      <h3>Cobrar · #${o.numero}${o.tipo==="En local"&&o.detalle?" · "+esc(mesaLabel(o)):""}</h3>
      <p>Total ${money(o.total)}${o.pagado>0?` · ya pagaron ${money(o.pagado)}`:""}</p>
      ${prev.length?`<div class="pgs">${prev.map(p=>`<div><span>✓ ${esc(p.m)}${p.por?" · "+esc(String(p.por).split(" ")[0]):""}</span><b class="num">${money(p.monto)}</b></div>`).join("")}</div>`:""}
      <div class="total" style="margin:6px 0 10px"><span>Falta cobrar</span><strong class="num">${money(saldo)}</strong></div>
      <div class="seg" style="margin-bottom:10px;flex-wrap:wrap">${[["todo","Todo"],["dividir","Dividir"],["items","Por productos"],["otro","Otro monto"]].map(([k,t])=>`<button data-mode="${k}" aria-pressed="${mode===k}">${t}</button>`).join("")}</div>
      ${mode==="dividir"?`<div class="splitrow"><span>Entre</span><div class="stepper"><button data-n="-1">−</button><b class="num">${n}</b><button data-n="1">+</button></div><span>personas → <b class="num">${money(monto)}</b> c/u</span></div>`:""}
      ${mode==="items"?`<div class="itsel">${o.items.map((i,ix)=>`<div class="itrow${sel[ix]?" on":""}"><span>${i.x?'<span class="xtag">adicional</span> ':""}${esc(i.n)} <small class="num">${money(i.p)}</small></span><div class="stepper"><button data-it="${ix}" data-d="-1">−</button><b class="num">${sel[ix]||0}/${i.q}</b><button data-it="${ix}" data-d="1">+</button></div></div>`).join("")}
        ${o.delivery?`<div class="itrow${sel.dlv?" on":""}"><span>Delivery <small class="num">${money(o.delivery)}</small></span><div class="stepper"><button data-dlv="1">${sel.dlv?"✓":"+"}</button></div></div>`:""}</div>`:""}
      ${mode==="otro"?`<label class="f" style="margin-bottom:10px"><span>Monto de este pago (S/)</span><input id="c-otro" inputmode="decimal" value="${esc(otro)}" placeholder="Ej. 15.00"></label>`:""}
      <div class="total" style="margin:0 0 10px;border-top:1.5px solid var(--ink);padding-top:8px"><span>Este pago</span><strong class="num" id="c-monto" style="color:${over?"var(--red)":"inherit"}">${money(monto)}</strong></div>
      ${over?`<div class="note" style="color:var(--red);margin:-6px 0 8px">Es más de lo que falta cobrar.</div>`:""}
      <div class="seg" style="margin-bottom:10px;flex-wrap:wrap">${METODOS.map(x=>`<button data-m="${x}" aria-pressed="${met===x}">${x}</button>`).join("")}</div>
      ${efectivo&&monto>0?`<label class="f" style="margin-bottom:8px"><span>Paga con (S/)</span><input id="c-pc" inputmode="decimal" value="${esc(pc)}" placeholder="Monto que entrega"></label>
      <div class="chips" style="margin-bottom:8px"><button data-b="${monto}">Exacto</button>${bills.map(b=>`<button data-b="${b}">S/ ${b}</button>`).join("")}</div>
      <div class="total" style="margin:0 0 12px"><span>Vuelto</span><strong class="num" id="c-v" style="color:${v!=null&&v<0?"var(--red)":"var(--green)"}">${v==null?"—":v<0?"Faltan "+money(-v):money(v)}</strong></div>`:""}
      <div class="row"><button class="btn ghost" id="c-close">Cerrar</button>
      <button class="btn primary" id="c-ok" ${!valid||(v!=null&&v<0)?"disabled":""}>${cierra?`Registrar y cerrar${o.tipo==="En local"?" mesa":""}`:`Registrar ${money(monto)}`}</button></div>
    </div></div>`;
    $("#c-close").onclick=()=>m.innerHTML="";
    $("#mbg").onclick=e=>{if(e.target.id==="mbg")m.innerHTML=""};
    m.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;pc="";draw()});
    m.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{n=Math.max(1,Math.min(20,n+ +b.dataset.n));pc="";draw()});
    m.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const ix=+b.dataset.it,q=o.items[ix].q;sel[ix]=Math.max(0,Math.min(q,(sel[ix]||0)+ +b.dataset.d));pc="";draw()});
    m.querySelectorAll("[data-dlv]").forEach(b=>b.onclick=()=>{sel.dlv=!sel.dlv;pc="";draw()});
    m.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{pc=b.dataset.b;draw()});
    m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{met=b.dataset.m;draw()});
    const io=$("#c-otro");if(io){io.oninput=()=>{otro=io.value;clearTimeout(io._t);io._t=setTimeout(()=>{draw();const x=$("#c-otro");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},500)}}
    const inp=$("#c-pc");if(inp)inp.oninput=()=>{pc=inp.value;const v2=parseFloat(pc)>0?r2(parseFloat(pc)-monto):null;const cv=$("#c-v");cv.textContent=v2==null?"—":v2<0?"Faltan "+money(-v2):money(v2);cv.style.color=v2!=null&&v2<0?"var(--red)":"var(--green)";const ok=$("#c-ok");if(ok)ok.disabled=!valid||(v2!=null&&v2<0)};
    const ok=$("#c-ok");if(ok)ok.onclick=async()=>{
      ok.disabled=true;
      const pcv=met==="Efectivo"&&parseFloat(pc)>0?r2(parseFloat(pc)):0,vu=pcv?Math.max(r2(pcv-monto),0):0;
      const who=S.session?.nombre||"",uid=S.session?.id||"";
      const pagos=[...pagosOf(o),{m:met,monto,pagaCon:pcv,vuelto:vu,por:who,porUid:uid,at:Date.now()}];
      const pagado=r2(pagos.reduce((a,p)=>a+p.monto,0)),full=pagado>=o.total-0.001;
      const ms=[...new Set(pagos.map(p=>p.m))];
      await patchOrder(o.id,{pagos,pagado:full?o.total:pagado,pago:full?"Pagado":"Parcial",metodo:ms.length>1?"Mixto":met,pagaCon:pcv,vuelto:vu,
        cerrada:full&&o.tipo==="En local"?true:!!o.cerrada,updatedAt:Date.now(),cobradoPor:who,cobradoUid:uid,cobradoAt:Date.now()});
      toast(`${full?"Cobrado":"Pago registrado"} ${money(monto)} · ${met}${vu?" · vuelto "+money(vu):""}`);
      if(full){m.innerHTML="";return}
      if(mode==="dividir")n=Math.max(1,n-1);
      if(mode==="items")sel={};
      otro="";pc="";
      setTimeout(draw,350);
    };
  };draw();
}

/* ===================== WHATSAPP ===================== */
function waText(o){
  const L=[`*la tiendita dulce* 🍓`,`Pedido *#${o.numero}* · ${new Date(o.createdAt).toLocaleDateString("es-PE")} ${hhmm(o.createdAt)}`];
  if(o.cliente)L.push(`Cliente: ${o.cliente}`);
  L.push(`${o.tipo}${o.detalle?": "+o.detalle:""}`,"");
  o.items.forEach(i=>L.push(`• ${i.q} x ${i.n}${i.x?" (adicional)":""} — ${money(i.p*i.q)}${i.nota?`\n   _${i.nota}_`:""}`));
  if(o.delivery)L.push(`Delivery: ${money(o.delivery)}`);
  L.push("",`*Total: ${money(o.total)}*`);
  if(o.pago==="Pagado")L.push(`Pagado (${metodoLabel(o)}) ✅`);
  else if((o.pagado||0)>0)L.push(`Pagado: ${money(o.pagado)} (${pagosOf(o).map(p=>p.m).join(" + ")}) · Saldo: ${money(o.total-o.pagado)}`);
  else L.push(`Pago: ${o.metodo} · pendiente`);
  if(o.pagaCon)L.push(`Paga con ${money(o.pagaCon)} · Vuelto ${money(o.vuelto||0)}`);
  if(o.notas)L.push("",`Nota: ${o.notas}`);
  L.push("",`Estado: ${ESTADOS.find(e=>e.k===o.estado)?.t||o.estado}`);
  return L.join("\n");
}
function waHref(o){
  let ph=(o.telefono||"").replace(/\D/g,"");
  if(ph.length===9)ph="51"+ph;
  return `https://wa.me/${ph}?text=${encodeURIComponent(waText(o))}`;
}

    "Método":metodoLabel(o),"Detalle de pagos":pagosOf(o).map(p=>`${p.m} ${p.monto.toFixed(2)}${p.por?" ("+String(p.por).split(" ")[0]+")":""}`).join(" + "),"Cobró":o.cobradoPor||"","Paga con (S/)":o.pagaCon||"","Vuelto (S/)":o.pagaCon?(o.vuelto||0):"","Pago":o.pago,"Pagado (S/)":o.pagado||0,"Saldo (S/)":Math.round((o.total-(o.pagado||0))*100)/100,
    "Estado":ESTADOS.find(e=>e.k===o.estado)?.t||o.estado,"Notas":o.notas||""}));
  const det=[];list.forEach(o=>o.items.forEach(i=>det.push({"N°":o.numero,"Fecha":new Date(o.createdAt).toLocaleDateString("es-PE"),"Ronda":i.r||1,"Producto":i.n,"Adicional":i.x?"Sí":"","Cant.":i.q,"P. unit (S/)":i.p,"Subtotal (S/)":i.p*i.q,"Nota":i.nota||"","Estado":o.estado})));
  const agg={};list.filter(o=>o.estado!=="cancelado").forEach(o=>o.items.forEach(i=>{agg[i.n]=agg[i.n]||{"Producto":i.n,"Unidades":0,"Venta (S/)":0};agg[i.n].Unidades+=i.q;agg[i.n]["Venta (S/)"]+=i.p*i.q}));
  const wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb,ws1,"Pedidos");
  const ws2=XLSX.utils.json_to_sheet(det);ws2["!cols"]=[{wch:5},{wch:11},{wch:6},{wch:40},{wch:6},{wch:11},{wch:12},{wch:25},{wch:11}];
  XLSX.utils.book_append_sheet(wb,ws2,"Detalle");
  const ws3=XLSX.utils.json_to_sheet(Object.values(agg).sort((a,b)=>b["Venta (S/)"]-a["Venta (S/)"]));ws3["!cols"]=[{wch:40},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws3,"Resumen productos");
  const cj={};list.filter(o=>o.estado!=="cancelado"&&(o.pagado||0)>0).forEach(o=>pagosOf(o).forEach(p=>{cj[p.m]=(cj[p.m]||0)+(p.monto||0)}));
  const ws4=XLSX.utils.json_to_sheet(Object.entries(cj).map(([m,v])=>({"Método":m,"Cobrado (S/)":Math.round(v*100)/100})));ws4["!cols"]=[{wch:16},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws4,"Caja");
  const fname=`pedidos_${S.range==="hoy"?dayKey(Date.now()):S.range==="dia"?(S.rangeDay||dayKey(Date.now())):S.range==="ayer"?dayKey(dayOffset(1)):S.range==="7d"?"ultimos-7-dias":"ultimos-45-dias"}.xlsx`;
  try{XLSX.writeFile(wb,fname);toast("Excel descargado")}catch(e){toast("No se pudo descargar el Excel")}
}

function dayOffset(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}
function inRange(o){
  const t=o.createdAt,k=dayKey(t);
  if(S.range==="todo")return true;
  if(S.range==="ayer")return k===dayKey(dayOffset(1));
  if(S.range==="7d")return t>=dayOffset(6).getTime();
  if(S.range==="dia")return k===(S.rangeDay||dayKey(Date.now()));
  return k===dayKey(Date.now());
}
function rangeLabel(short){
  if(S.range==="ayer")return"ayer";
  if(S.range==="7d")return short?"7 días":"últimos 7 días";
  if(S.range==="todo")return short?"45 días":"últimos 45 días";
  if(S.range==="dia"){const d=new Date((S.rangeDay||dayKey(Date.now()))+"T12:00:00");return d.toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"})}
  return"hoy";
}
function rangeSelect(style){
  const minD=dayKey(dayOffset(44)),maxD=dayKey(Date.now());
  return`<span class="rsel"><select id="range" aria-label="Periodo" ${style?`style="${style}"`:""}>
    ${[["hoy","Hoy"],["ayer","Ayer"],["7d","Últimos 7 días"],["todo","Últimos 45 días"],["dia","Elegir un día…"]].map(([k,t])=>`<option value="${k}" ${S.range===k?"selected":""}>${t}</option>`).join("")}</select>
    ${S.range==="dia"?`<input type="date" id="rangeDay" min="${minD}" max="${maxD}" value="${S.rangeDay||maxD}">`:""}</span>`;
}
function filtered(){
  return S.orders.filter(inRange).filter(o=>{
    if(S.filter==="activos")return ACTIVOS.includes(o.estado);
    if(S.filter==="todos")return true;
    if(S.filter==="porcobrar")return o.estado!=="cancelado"&&(o.pagado||0)<o.total-0.001;
    return o.estado===S.filter;
  }).sort((a,b)=>S.filter==="activos"?a.createdAt-b.createdAt:b.createdAt-a.createdAt);
}
function isMine(o){const u=S.session?.id;return !!u&&(o.atendioUid===u||(o.rondas||[]).some(x=>x.porUid===u))}
function renderDespacho(){

  }return h;
}
