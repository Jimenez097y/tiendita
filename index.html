function renderVentas(){
  if(!S.owner)return"";
  const menuIdx={};MENU.forEach(c=>c.items.forEach(i=>menuIdx[i.n]={cat:c.t,catId:c.id}));
  const base=n=>{if(menuIdx[n])return n;const b=n.split(" (")[0];return menuIdx[b]?b:n};
  const valid=S.orders.filter(inRange).filter(o=>o.estado!=="cancelado");
  const agg={},xs={};let units=0;
  valid.forEach(o=>o.items.forEach(i=>{
    if(i.x){xs[i.n]=xs[i.n]||{q:0,v:0};xs[i.n].q+=i.q;xs[i.n].v+=i.p*i.q;return}
    const k=base(i.n);agg[k]=agg[k]||{q:0,v:0,var:{}};agg[k].q+=i.q;agg[k].v+=i.p*i.q;units+=i.q;
    if(k!==i.n){const vn=i.n.slice(k.length).replace(/^\s*\(|\)\s*$/g,"");agg[k].var[vn]=(agg[k].var[vn]||0)+i.q}
  }));
  const rows=Object.entries(agg).sort((a,b)=>b[1].q-a[1].q||b[1].v-a[1].v);
  const max=rows.length?rows[0][1].q:1;
  const tab=S.venTab||"top";
  const zero=[];MENU.forEach(c=>{const z=c.items.filter(i=>!agg[i.n]);if(z.length)zero.push([c,z])});
  const zeroN=zero.reduce((a,[,z])=>a+z.length,0);
  const lbl=S.range==="hoy"?"hoy":S.range==="ayer"?"ayer":S.range==="dia"?"el "+rangeLabel():"en "+rangeLabel();
  return`<div class="h2"><span>Ventas por producto</span>
    ${rangeSelect("font-size:13px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:800")}</div>
   <div class="kpis" style="margin-top:0">
    <div class="kpi"><div class="k">Unidades ${lbl}</div><div class="v num">${units}</div></div>
    <div class="kpi"><div class="k">Productos vendidos</div><div class="v num">${rows.length}<span style="font-size:13px;color:var(--muted)"> / ${Object.keys(menuIdx).length}</span></div></div>
   </div>
   ${rows.length?`<div class="topone">🏆 Lo más pedido ${lbl}: <b>${esc(rows[0][0])}</b> · <span class="num">${rows[0][1].q}</span></div>`:""}
   <div class="seg" data-seg="ven" style="margin:10px 0">
    <button data-v="top" aria-pressed="${tab==="top"}">Lo que se vende <span class="num">(${rows.length})</span></button>
    <button data-v="zero" aria-pressed="${tab==="zero"}">Sin ventas <span class="num">(${zeroN})</span></button></div>
   ${tab==="top"?(rows.length?`<div class="rank">${rows.map(([n,a],ix)=>`<div class="rk" title="${esc(n)}: ${a.q} unidades · ${money(a.v)}">
      <div class="rkh"><span class="rkn"><b class="num">${ix+1}.</b> ${esc(n)}</span><span class="rkv"><b class="num">${a.q}</b> <small class="num">${money(a.v)}</small></span></div>
      <div class="bar"><i style="width:${Math.max(4,Math.round(a.q/max*100))}%"></i></div>
      ${Object.keys(a.var).length?`<div class="rkvar">${Object.entries(a.var).sort((x,y)=>y[1]-x[1]).map(([vn,q])=>`${esc(vn)} ${q}`).join(" · ")}</div>`:""}
    </div>`).join("")}</div>`:`<div class="empty">Todavía no hay ventas ${lbl}.</div>`)
   :(zeroN?zero.map(([c,z])=>`<div class="zcat">${esc(c.t)}</div><div class="zchips">${z.map(i=>`<span class="${S.agotados.has(i.n)?"ag0":""}">${esc(i.n)}${S.agotados.has(i.n)?" · agotado":""}</span>`).join("")}</div>`).join(""):`<div class="empty">¡Todo se ha vendido al menos una vez ${lbl}! 🎉</div>`)}
   ${Object.keys(xs).length&&tab==="top"?`<div class="zcat" style="margin-top:14px">Adicionales</div><div class="rank">${Object.entries(xs).sort((a,b)=>b[1].q-a[1].q).map(([n,a])=>`<div class="rkh" style="padding:4px 0"><span class="rkn">${esc(n)}</span><span class="rkv"><b class="num">${a.q}</b> <small class="num">${money(a.v)}</small></span></div>`).join("")}</div>`:""}
   <div class="note" style="margin-top:12px">Se actualiza solo con cada pedido. No cuenta pedidos cancelados; sí cuenta las rondas agregadas.</div>`;
}
function renderEquipo(){
  if(!S.owner)return"";
  const f=S.acctForm,me=S.session?.id;
  return`<div class="h2"><span>Equipo</span></div>
   <div class="team">${S.accounts.map(a=>`<div class="acct"><span class="av${a.rol==="propietario"?" own":a.rol==="cocina"?" kit":a.rol==="delivery"?" dlv":""}">${esc(initials(a.nombre))}</span>
     <div class="i"><b>${esc(a.nombre)}${a.id===me?" (tú)":""}</b><span>@${esc(a.usuario)} · ${a.rol==="propietario"?"propietario":a.rol==="cocina"?"cocina":a.rol==="delivery"?"delivery":"mesero"}${a.activo===false?" · desactivado":""}</span></div>
     ${a.id===me?"":a.activo===false?`<button data-acct-on="${a.id}" style="color:var(--green)">Reactivar</button>`:S.confirmDel==="acct:"+a.id?`<button data-acct-yes="${a.id}">¿Seguro?</button>`:`<button data-acct-del="${a.id}">Desactivar</button>`}</div>`).join("")||`<div class="empty">Cargando…</div>`}</div>
   <form class="card" id="acctform" autocomplete="off"><h3>Nuevo usuario</h3>
    <div class="fields">
     <label class="f full"><span>Nombre</span><input id="a-nombre" data-a="nombre" value="${esc(f.nombre)}" required maxlength="40"></label>
     <label class="f"><span>Usuario</span><input id="a-usuario" data-a="usuario" value="${esc(f.usuario)}" required maxlength="30" autocapitalize="none" spellcheck="false"></label>
     <label class="f"><span>Clave</span><input id="a-clave" data-a="clave" value="${esc(f.clave)}" required minlength="6" placeholder="mín. 6"></label>
     <div class="full"><div class="seg" data-seg="rol" style="flex-wrap:wrap">${[["mesero","Mesero"],["cocina","Cocina"],["delivery","Delivery"],["propietario","Propietario"]].map(([k,t])=>`<button type="button" data-v="${k}" aria-pressed="${f.rol===k}">${t}</button>`).join("")}</div></div>
    </div>
    <button class="btn primary" type="submit" style="margin-top:12px">Crear usuario</button>
    <div class="note">Entrega el usuario y la clave en persona; cada uno puede cambiar su clave tocando su nombre arriba. Si alguien olvida su clave o deja de trabajar contigo, desactívalo y créale un usuario nuevo (un usuario no se puede repetir).</div>
   </form>`;
}
function render(){
  const active=S.orders.filter(o=>dayKey(o.createdAt)===dayKey(Date.now())&&ACTIVOS.includes(o.estado)&&(!S.delivery||o.tipo==="Delivery")).length;
  const nItems=S.cart.reduce((a,l)=>a+l.q,0);
  const b1=$("#badge");b1.textContent=active;b1.hidden=!active;
  if(S.owner){const bf=$("#badge-fin"),n=(S.obligs||[]).filter(o=>!o.pagado&&daysTo(o.vence)<=7).length;bf.textContent=n;bf.hidden=!n}
  const b2=$("#badge-cart");b2.textContent=nItems;b2.hidden=!nItems;
  const app=$("#app"),st=app.scrollTop;
  const focusId=document.activeElement?.id,selS=document.activeElement?.selectionStart;
  if(!S.session){app.innerHTML="";return}
  app.innerHTML=S.view==="carta"?renderCarta():S.view==="pedido"?renderPedido():S.view==="equipo"?renderEquipo():S.view==="ventas"?renderVentas():S.view==="finanzas"?renderFinanzas():renderPedidos();
  app.scrollTop=st;
  if(focusId){const el=document.getElementById(focusId);if(el&&el.tagName!=="BUTTON"&&app.contains(el)){el.focus({preventScroll:true});try{if(selS!=null)el.setSelectionRange(selS,selS)}catch(e){}}}
  const bar=$("#bar");
  if(S.view==="carta"&&(nItems||S.addTo)){bar.hidden=false;
    const at=S.addTo&&S.orders.find(x=>x.id===S.addTo);
    bar.innerHTML=`<span>${at?esc(mesaLabel(at))+" · ":""}<b class="num">${nItems}</b> ${nItems===1?"prod.":"productos"} · <b class="num">${money(cartTotal())}</b></span><button id="gocart">${at?"Revisar ronda →":"Ver pedido →"}</button>`;
    $("#gocart").onclick=()=>setView("pedido");
  }else bar.hidden=true;
}

/* ===================== EVENTS ===================== */
$("#app").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.goto){setView(d.goto);return}
  if(d.fin&&S.owner){finClick(d);return}
  if(d.extra){openExtra(d.extra);return}
  if(d.cat){S.cat=d.cat;render();$("#app").scrollTop=0;return}
  if(d.acc){if(!S.open)S.open=new Set();const id=d.acc,was=S.open.has(id);was?S.open.delete(id):S.open.add(id);render();
    if(!was){const el=document.getElementById("acc-"+id),app=$("#app"),st=document.querySelector("#app .stick");if(el)app.scrollTo({top:app.scrollTop+el.getBoundingClientRect().top-app.getBoundingClientRect().top-(st?st.offsetHeight:0)-6,behavior:"smooth"})}return}
  if(d.accall){S.open=d.accall==="open"?new Set(MENU.map(c=>c.id)):new Set();render();if(d.accall==="close")$("#app").scrollTop=0;return}
  if(d.dispedit&&canEditDisp()){S.dispEdit=!S.dispEdit;render();return}
  if(d.dispreset&&canEditDisp()){S.agotados=new Set();render();fdb.collection("config").doc("disponibilidad").set({agotados:[],updatedAt:Date.now(),por:S.session?.nombre||""}).then(()=>toast("Todo disponible")).catch(e=>toast(fbErr(e)));return}
  if(b.classList.contains("item")&&S.dispEdit&&canEditDisp()){toggleAgotado(d.n);return}
  if(b.classList.contains("item")&&S.agotados.has(d.n)){toast("Agotado hoy");return}
  if(b.classList.contains("item")){
    const it=MENU.find(c=>c.id===d.c).items.find(i=>i.n===d.n);
    it.o?openPicker(it):addItem(it);return}
  if(d.inc!=null){S.cart[+d.inc].q++;render();return}
  if(d.dec!=null){const l=S.cart[+d.dec];l.q--;if(l.q<=0)S.cart.splice(+d.dec,1);render();return}
  const seg=b.closest("[data-seg]");
  if(seg&&d.v){if(seg.dataset.seg==="tipo")S.form.tipo=d.v;else if(seg.dataset.seg==="rol")S.acctForm.rol=d.v;else if(seg.dataset.seg==="desp"){S.despTab=d.v;render();$("#app").scrollTop=0;return}else if(seg.dataset.seg==="fin"){S.finTab=d.v;S.finConfirm=null;render();$("#app").scrollTop=0;return}else if(seg.dataset.seg==="ven"){S.venTab=d.v;render();$("#app").scrollTop=0;return}else if(seg.dataset.seg==="dlv"){S.dlvTab=d.v;render();$("#app").scrollTop=0;return}else S.filter=d.v;render();return}
  if(d.acctDel&&S.owner){S.confirmDel="acct:"+d.acctDel;render();return}
  if(d.acctYes&&S.owner){S.confirmDel=null;setActive(d.acctYes,false).then(()=>{toast("Usuario desactivado");loadAccounts()}).catch(e=>toast(fbErr(e)));return}
  if(d.acctOn&&S.owner){setActive(d.acctOn,true).then(()=>{toast("Usuario reactivado");loadAccounts()}).catch(e=>toast(fbErr(e)));return}
  if(b.id==="send"){submitOrder();return}
  if(b.id==="noadd"||d.noadd){S.addTo=null;render();return}
  if(b.id==="clear"){S.addTo=null;S.cart=[];S.form=blankForm();S.editing=null;render();return}
  if(b.id==="xls"){exportExcel(S.orders.filter(inRange));return}
  if(d.est){const k=d.est;S.openEst.has(k)?S.openEst.delete(k):S.openEst.add(k);render();return}
  if(d.estall){S.openEst=d.estall==="open"?new Set(["pendiente","preparando","listo","encamino","entregado"]):new Set();render();return}
  if(b.id==="caja"&&S.owner){openCaja();return}
  if(!S.owner&&(d.edit||d.cancel||d.reopen||d.del||d.delYes||b.id==="xls"))return;
  if(d.adv){const o=S.orders.find(x=>x.id===d.adv);if(!S.owner&&!S.cocina&&!["listo","encamino"].includes(o.estado))return;const ne=nextOf(o);const pt={estado:ne,updatedAt:Date.now()};if(ne==="encamino"){pt.repartidor=S.session?.nombre||"";pt.repartidorUid=S.session?.id||"";pt.salioAt=Date.now()}patchOrder(d.adv,pt);toast(ne==="encamino"?"🛵 En camino":ESTADOS.find(x=>x.k===ne).t);return}
  if(d.addto){startAddTo(d.addto);return}
  if(d.close&&S.owner){patchOrder(d.close,{cerrada:true,updatedAt:Date.now()});toast("Mesa cerrada");return}
  if(d.pay){openCobro(d.pay);return}
  if(d.edit){editOrder(d.edit);return}
  if(d.cancel){patchOrder(d.cancel,{estado:"cancelado",updatedAt:Date.now()});return}
  if(d.reopen){patchOrder(d.reopen,{estado:"pendiente",updatedAt:Date.now()});return}
  if(d.del){S.confirmDel=d.del;render();return}
  if(d.delYes){S.confirmDel=null;removeOrder(d.delYes);return}
  if(b.hasAttribute("data-del-no")){S.confirmDel=null;render();return}
});
$("#app").addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;render();return}
  if(t.dataset.a){S.acctForm[t.dataset.a]=t.value;return}
  if(t.dataset.nota!=null){S.cart[+t.dataset.nota].nota=t.value;return}
  if(t.dataset.f==="detalle"&&S.form.tipo==="En local"){S.form.detalle=t.value;render();return}
  if(t.dataset.f){S.form[t.dataset.f]=t.value;if(t.dataset.f==="adelanto"||t.dataset.f==="delivery"||t.dataset.f==="pagaCon"){const vv=$("#vuelto-val");if(vv)vv.textContent=vueltoTxt(formVuelto())||"—";const s=document.querySelector(".saldo");if(s)s.textContent="Saldo por cobrar: "+money(Math.max(orderTotal()-(parseFloat(S.form.adelanto)||0),0));const tv=$("#tot-val");if(tv)tv.textContent=money(orderTotal());const dv=$("#deliv-val");if(dv)dv.textContent=money(delivFee())}}
});
$("#app").addEventListener("submit",async e=>{
  if(e.target.id!=="acctform")return;e.preventDefault();
  if(!S.owner)return;
  const f=S.acctForm,usuario=f.usuario.trim().toLowerCase(),nombre=f.nombre.trim();
  if(!nombre||!usuario||f.clave.length<6){toast("Completa nombre, usuario y clave (mín. 6)");return}
  if(!/^[a-z0-9._-]+$/.test(usuario)){toast("Usuario: solo letras, números, punto o guion");return}
  const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;
  try{await createAccount({nombre,usuario,clave:f.clave,rol:f.rol});
    toast("Usuario creado: "+usuario);S.acctForm={nombre:"",usuario:"",clave:"",rol:"mesero"};loadAccounts();render()}
  catch(err){toast(fbErr(err));btn.disabled=false}
});
$("#app").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="range"){S.range=t.value;if(t.value==="dia"&&!S.rangeDay)S.rangeDay=dayKey(dayOffset(1));render();return}
  if(t.id==="finMes"){S.finMes=+t.value;render();return}
  if(t.id==="rangeDay"){S.rangeDay=t.value||dayKey(Date.now());render();return}
  if(t.dataset.f==="pago"||t.dataset.f==="metodo"){S.form[t.dataset.f]=t.value;render()}
});

render();
S.gateMode="loading";renderGate();
boot();setInterval(()=>{if(S.view==="pedidos")render()},60000);
/* aviso de nueva versión */
const APP_VERSION="2026-10-05b";
async function checkVersion(){
  try{const t=await fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"}).then(r=>r.text());
    const m=t.match(/APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION&&!document.getElementById("upd")){
      const d=document.createElement("button");d.id="upd";d.className="toast";d.style.cssText="top:auto;bottom:130px;border:0;cursor:pointer";
      d.textContent="Hay una nueva versión · toca para actualizar";d.onclick=()=>location.reload();$("#phone").appendChild(d);}
  }catch(e){}
}
setInterval(checkVersion,5*60e3);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion()});
</script>
